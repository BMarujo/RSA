services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - v2x_net

  traci-bridge:
    image: rsa-traci-bridge:latest
    build:
      context: .
      dockerfile: sim/bridge/Dockerfile
    restart: unless-stopped
    depends_on:
      - mqtt-broker
    environment:
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=1883
      - SUMO_CFG=${SUMO_CFG:-/data/sumo-lane-merge/aveiro_map/vanetza.sumocfg}
      - SUMO_GUI=${SUMO_GUI:-true}
      - DISPLAY=${DISPLAY:-:0}
      - STEP_LENGTH=${STEP_LENGTH:-0.1}
      - STEP_DELAY_S=${STEP_DELAY_S:-0.02}
      - SPEED_COMMAND_DURATION_S=${SPEED_COMMAND_DURATION_S:-2.0}
      - COLLISION_GUARD=${COLLISION_GUARD:-false}
      - COLLISION_GUARD_LOOKAHEAD=${COLLISION_GUARD_LOOKAHEAD:-35.0}
      - COLLISION_GUARD_MIN_GAP=${COLLISION_GUARD_MIN_GAP:-6.5}
      - COLLISION_GUARD_HEADWAY_S=${COLLISION_GUARD_HEADWAY_S:-0.65}
      - COLLISION_GUARD_SPEED_DELTA=${COLLISION_GUARD_SPEED_DELTA:-0.8}
      - COLLISION_GUARD_MIN_SPEED=${COLLISION_GUARD_MIN_SPEED:-1.5}
      - COLLISION_GUARD_DURATION_S=${COLLISION_GUARD_DURATION_S:-0.8}
      - TRACI_DEFAULT_SPEED_MODE=${TRACI_DEFAULT_SPEED_MODE:-0}
      - LANE_CHANGE_DURATION_S=${LANE_CHANGE_DURATION_S:-3.0}
      - LANE_CHANGE_COOLDOWN_S=${LANE_CHANGE_COOLDOWN_S:-2.0}
      - LOOP_SIM=${LOOP_SIM:-true}
      - LOOP_PAUSE_S=${LOOP_PAUSE_S:-1.0}
      - SUMO_END=${SUMO_END:-120}
      - SUMO_EXTRA_ARGS=${SUMO_EXTRA_ARGS:---emergencydecel.warning-threshold 100.0}
      - VEHICLE_IDS=${VEHICLE_IDS:-}
      - GUI_MARKERS=${GUI_MARKERS:-true}
      - GUI_TRACK_VEHICLE=${GUI_TRACK_VEHICLE:-none}
      - GUI_FIXED_MERGE_VIEW=${GUI_FIXED_MERGE_VIEW:-true}
      - GUI_MERGE_VIEW_RADIUS=${GUI_MERGE_VIEW_RADIUS:-95}
      - GUI_FIT_NETWORK=${GUI_FIT_NETWORK:-false}
      - GUI_BOUNDARY_PADDING=${GUI_BOUNDARY_PADDING:-80}
      - GUI_ZOOM=${GUI_ZOOM:-1800}
      - GUI_MARKER_RADIUS=${GUI_MARKER_RADIUS:-9}
      - GUI_BADGE_SIZE=${GUI_BADGE_SIZE:-5}
      - GUI_MERGE_POINT=${GUI_MERGE_POINT:-true}
      - GUI_MERGE_ZONE_LENGTH=${GUI_MERGE_ZONE_LENGTH:-13}
      - GUI_MERGE_ZONE_WIDTH=${GUI_MERGE_ZONE_WIDTH:-1.1}
      - GUI_MERGE_ZONE_GAP=${GUI_MERGE_ZONE_GAP:-5.5}
      - GUI_MERGE_ZONE_ANGLE_DEG=${GUI_MERGE_ZONE_ANGLE_DEG:-0}
      - GUI_VEHICLE_SKINS=${GUI_VEHICLE_SKINS:-true}
      - GUI_VEHICLE_SKIN_SCALE=${GUI_VEHICLE_SKIN_SCALE:-1.18}
      - GUI_VEHICLE_SKIN_DETAIL=${GUI_VEHICLE_SKIN_DETAIL:-false}
      - GUI_DIM_SUMO_VEHICLES=${GUI_DIM_SUMO_VEHICLES:-true}
      - GUI_ROLE_MARKERS=${GUI_ROLE_MARKERS:-false}
      - GUI_STATE_BADGES=${GUI_STATE_BADGES:-false}
      - GUI_STATE_BODY_TINT=${GUI_STATE_BODY_TINT:-false}
      - GUI_STATE_BODY_TINT_AMOUNT=${GUI_STATE_BODY_TINT_AMOUNT:-0.34}
      - GUI_STATE_INDICATOR_WIDTH=${GUI_STATE_INDICATOR_WIDTH:-0.22}
      - GUI_STATE_ROOF=${GUI_STATE_ROOF:-false}
      - GUI_SHOW_CRUISE_STATE=${GUI_SHOW_CRUISE_STATE:-false}
      - GUI_COLOR_VEHICLES_BY_STATE=${GUI_COLOR_VEHICLES_BY_STATE:-false}
      - GUI_BRAKE_LIGHTS=${GUI_BRAKE_LIGHTS:-true}
      - GUI_BRAKE_LIGHT_SIZE=${GUI_BRAKE_LIGHT_SIZE:-1.15}
      - GUI_BRAKE_DECEL_THRESHOLD=${GUI_BRAKE_DECEL_THRESHOLD:-0.25}
      - MERGE_POINT_X=${MERGE_POINT_X:-194.89}
      - MERGE_POINT_Y=${MERGE_POINT_Y:-2212.42}
    volumes:
      - ./:/data:ro
      - ./results:/results
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    networks:
      - v2x_net

networks:
  v2x_net:
    driver: bridge
