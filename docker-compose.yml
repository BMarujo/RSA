      - VANETZA_LOCAL_MQTT_PORT=1883
      - VANETZA_REMOTE_MQTT_BROKER=mqtt-broker
      - VANETZA_REMOTE_MQTT_PORT=1883
      - VANETZA_STATION_ID=102
      - VANETZA_STATION_TYPE=5
      - VANETZA_MAC_ADDRESS=6e:06:e0:03:00:12
      - VANETZA_INTERFACE=br0
      - ORIGIN_LAT=40.0
      - ORIGIN_LON=-8.0
      - MERGE_POINT_X=194.89
      - MERGE_POINT_Y=2212.42
      - CRUISE_SPEED=11.0
      - MERGE_SPEED_BONUS=0.75
      - LEAD_SPEED_BONUS=1.0
      - MERGE_PRIORITY=true
      - DEFAULT_SPEED_MODE=31
      - PRIORITY_SPEED_MODE=0
      - PRIORITY_DISTANCE=120.0
      - MERGE_STATION_ID=0
      - RAMP_EDGE_IDS=34126779
      - MAIN_EDGE_IDS=560761994,1331698336,135424828
      - RAMP_Y_THRESHOLD=-1.0
      - RAMP_BBOX=205,2120,340,2225
      - ROLE_DETECTION_DISTANCE=260.0
      - SAFE_HEADWAY_S=1.5
      - NEGOTIATION_TIMEOUT_S=2.0
      - REQUEST_RETRY_S=0.5
      - RESPONSE_PERIOD_S=0.5
      - YIELD_SPEED_DELTA=6.0
      - ABORT_SPEED=2.0
      - MIN_SPEED=0.5
      - MERGE_LANE_INDEX=1
      - ENABLE_MCM=true
      - ENABLE_DENM=false
      - ETA_THRESHOLD_S=12.0
      - STATUS_PERIOD_MS=250
      - PUBLISH_IDLE_ACTUATORS=true
    networks:
      - v2x_net

  obu-merge:
    build:
      context: .
      dockerfile: obu/Dockerfile
    restart: unless-stopped
    depends_on:
      - mqtt-broker
    cap_add:
      - "NET_ADMIN"
      - "NET_RAW"
    ports:
      - "1886:1883"
    environment:
      - VEHICLE_ID=Merge_Car
      - VEHICLE_ROLE=auto
      - ROLE_MODE=auto
      - STATION_ID=103
      - STATION_TYPE=5
      - MCM_STATION_TYPE=1
      - START_EMBEDDED_MOSQUITTO=true
      - SUPPORT_MAC_BLOCKING=true
      - REMOTE_MQTT_HOST=mqtt-broker
      - REMOTE_MQTT_PORT=1883
      - LOCAL_MQTT_HOST=127.0.0.1
      - LOCAL_MQTT_PORT=1883
      - VANETZA_LOCAL_MQTT_BROKER=127.0.0.1
      - VANETZA_LOCAL_MQTT_PORT=1883
      - VANETZA_REMOTE_MQTT_BROKER=mqtt-broker
      - VANETZA_REMOTE_MQTT_PORT=1883
      - VANETZA_STATION_ID=103
      - VANETZA_STATION_TYPE=5
      - VANETZA_MAC_ADDRESS=6e:06:e0:03:00:13
      - VANETZA_INTERFACE=br0
      - ORIGIN_LAT=40.0
      - ORIGIN_LON=-8.0
      - MERGE_POINT_X=194.89
      - MERGE_POINT_Y=2212.42
      - CRUISE_SPEED=11.0
      - MERGE_SPEED_BONUS=0.75
      - LEAD_SPEED_BONUS=1.0
      - MERGE_PRIORITY=true
      - DEFAULT_SPEED_MODE=31
      - PRIORITY_SPEED_MODE=0
      - PRIORITY_DISTANCE=120.0
      - MERGE_STATION_ID=0
      - RAMP_EDGE_IDS=34126779
      - MAIN_EDGE_IDS=560761994,1331698336,135424828
      - RAMP_Y_THRESHOLD=-1.0
      - RAMP_BBOX=205,2120,340,2225
      - ROLE_DETECTION_DISTANCE=260.0
      - SAFE_HEADWAY_S=1.5
      - NEGOTIATION_TIMEOUT_S=2.0
      - REQUEST_RETRY_S=0.5
      - RESPONSE_PERIOD_S=0.5
      - YIELD_SPEED_DELTA=6.0
      - ABORT_SPEED=2.0
      - MIN_SPEED=0.5
      - MERGE_LANE_INDEX=1
      - ENABLE_MCM=true
      - ENABLE_DENM=false
      - ETA_THRESHOLD_S=12.0
      - STATUS_PERIOD_MS=250
      - PUBLISH_IDLE_ACTUATORS=true
